# ---------------------------------------------------------------------------
# MyWe HRMS - environment configuration
# Every key here can be overridden at runtime with an environment variable:
# upper-case the key and replace dots with underscores
#   base.url  ->  BASE_URL        headless  ->  HEADLESS
# ---------------------------------------------------------------------------

# --- Application under test -------------------------------------------------
base.url=https://test.mywehr.com
login.path=/login
tenant.code=myc001

# --- Browser ----------------------------------------------------------------
# chromium | chrome | firefox | edge | webkit
browser=chromium
headless=false
browser.width=1920
browser.height=1080

# --- Waits (seconds) --------------------------------------------------------
# The app is a React SPA behind a "Loading Mywe HRMS..." splash, so page
# transitions need a slightly longer explicit wait than a server-rendered app.
explicit.wait=25
page.load.timeout=60
spa.settle.wait=20
# Best-effort wait for MUI skeletons/spinners after a data fetch. Kept short on
# purpose: it is an optimisation, not a correctness gate, and some charts keep a
# shimmer element mounted indefinitely.
data.settle.wait=8
polling.interval.millis=300
# Whole-test timeout. The full onboarding journey is long.
test.timeout=300

# --- Reporting --------------------------------------------------------------
report.dir=test-output/reports
artifacts.dir=test-output/artifacts
# on | only-on-failure | off
screenshot=on
# on | retain-on-failure | off
trace=retain-on-failure
video=retain-on-failure

# --- Execution --------------------------------------------------------------
retry.count=1
