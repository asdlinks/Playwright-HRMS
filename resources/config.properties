# ---------------------------------------------------------------------------
# MyWe HRMS - environment configuration
# Every key here can be overridden at runtime with an environment variable:
# the key upper-cased with dots replaced by underscores (browser -> BROWSER,
# base.url -> BASE_URL, retry.count -> RETRY_COUNT).
# ---------------------------------------------------------------------------

# --- Application under test -------------------------------------------------
base.url=https://test.mywehr.com
login.path=/login
tenant.code=myc001

# --- Browser ----------------------------------------------------------------
# chrome | firefox | edge | webkit | remote-chrome | remote-firefox
browser=chrome
headless=false
browser.width=1920
browser.height=1080
# Playwright server for the remote-* browsers (npx playwright run-server).
grid.url=ws://localhost:3000/

# --- Waits (seconds) --------------------------------------------------------
# The app is a React SPA behind a "Loading Mywe HRMS..." splash, so page
# transitions need a slightly longer explicit wait than a server-rendered app.
explicit.wait=25
page.load.timeout=60
spa.settle.wait=20
# Best-effort wait for MUI skeletons/spinners after a data fetch. Kept short on
# purpose: it is an optimisation, not a correctness gate, and some charts keep a
# shimmer element mounted indefinitely - paying the full explicit wait on every
# navigation would add minutes to the suite for no extra confidence.
data.settle.wait=8
polling.interval.millis=300
# How long a native click may wait for its target to accept the pointer before
# the framework falls back to a scripted click. Selenium failed an intercepted
# click at once; Playwright retries it until this timeout instead.
native.click.timeout.millis=5000
# Upper bound for one test, in minutes. The persona sweeps take several.
test.timeout.minutes=15

# --- Reporting --------------------------------------------------------------
report.dir=test-output/reports
screenshot.dir=test-output/screenshots
screenshot.on.failure=true
screenshot.on.success=true
# Screenshot every passing soft check, not just failures (much larger report).
screenshot.on.soft.pass=true
# Before each report screenshot: max wait for MUI loaders to clear, then a
# pause for fade/slide transitions. Passing checks get a shorter wait - the
# page has normally loaded by then - failures and final states the full one.
screenshot.settle.millis=4000
screenshot.pass.settle.millis=1500
screenshot.animation.millis=400

# --- Execution --------------------------------------------------------------
retry.count=1
